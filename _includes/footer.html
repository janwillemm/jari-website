<footer class="site-footer">
  <div class="container site-footer__grid">
    <div class="site-footer__brand">
      <p class="site-footer__title">GGZ Tools</p>
      <p>{{ site.tagline }}. Interactieve interventies voor behandelaren en kinderen.</p>
    </div>

    <div>
      <p class="site-footer__label">Navigatie</p>
      <ul class="site-footer__links">
        {% for item in site.header_pages %}
          <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </div>

    <div>
      <p class="site-footer__label">Contact</p>
      <p>
        <a href="mailto:{{ site.contact.email }}">{{ site.contact.email }}</a>
      </p>
    </div>
  </div>

  <div class="site-footer__bottom">
    <div class="container">
      <p>&copy; {{ 'now' | date: '%Y' }} GGZ Tools</p>
    </div>
  </div>
</footer>
