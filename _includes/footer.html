<footer class="site-footer">
  <div class="container site-footer__grid">
    <div class="site-footer__brand">
      <img
        class="site-footer__logo"
        src="{{ '/assets/images/brand/logo-with-text.png' | relative_url }}"
        alt="{{ site.title }}"
        width="512"
        height="325"
        loading="lazy"
        decoding="async"
      />
      <p>{{ site.tagline }}. Tools voor professionals in de GGZ voor het werken met kinderen en gezinnen.</p>
    </div>

    <div>
      <p class="site-footer__label">Navigatie</p>
      <ul class="site-footer__links">
        {% for item in site.header_pages %}
          <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </div>

    <div>
      <p class="site-footer__label">Contact</p>
      <p>
        <a href="mailto:{{ site.contact.email }}">{{ site.contact.email }}</a>
      </p>
    </div>
  </div>

  <div class="site-footer__bottom">
    <div class="container">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
    </div>
  </div>
</footer>
