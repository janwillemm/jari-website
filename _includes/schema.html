{%- assign org_id = site.url | append: "/#organization" -%}
{%- assign website_id = site.url | append: "/#website" -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": {{ org_id | jsonify }},
      "name": {{ site.title | jsonify }},
      "url": {{ site.url | jsonify }},
      "email": {{ site.contact.email | jsonify }},
      "logo": {{ site.logo | absolute_url | jsonify }},
      "description": {{ site.description | jsonify }},
      "parentOrganization": {
        "@type": "Organization",
        "name": "Creatieve M(a)an B.V.",
        "url": "https://creatievemaan.nl/"
      },
      "founder": [
        {%- for author in site.authors %}
        { "@id": {{ site.url | append: "/#" | append: author.id | jsonify }} }{%- unless forloop.last -%},{%- endunless -%}
        {%- endfor %}
      ]
    },
    {%- for author in site.authors %}
    {
      "@type": "Person",
      "@id": {{ site.url | append: "/#" | append: author.id | jsonify }},
      "name": {{ author.name | jsonify }},
      "jobTitle": {{ author.job_title | default: author.role | jsonify }},
      "description": {{ author.description | jsonify }},
      "worksFor": { "@id": {{ org_id | jsonify }} },
      "url": {{ "/over-ons/" | absolute_url | jsonify }}
    },
    {%- endfor %}
    {
      "@type": "WebSite",
      "@id": {{ website_id | jsonify }},
      "name": {{ site.title | jsonify }},
      "url": {{ site.url | jsonify }},
      "description": {{ site.description | jsonify }},
      "inLanguage": "nl-NL",
      "publisher": { "@id": {{ org_id | jsonify }} }
    }{%- if page.collection == "tools" -%},
    {
      "@type": "SoftwareApplication",
      "name": {{ page.name | jsonify }},
      "description": {{ page.description | default: page.summary | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "image": {{ page.image | absolute_url | jsonify }},
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": {{ site.tool_yearly_price | jsonify }},
        "priceCurrency": "EUR"
      },
      "audience": {
        "@type": "Audience",
        "audienceType": "GGZ-professionals"
      },
      "author": { "@id": {{ org_id | jsonify }} }
    }{%- endif -%}
    {%- if page.faq -%},
    {
      "@type": "FAQPage",
      "mainEntity": [
        {%- for item in page.faq %}
        {
          "@type": "Question",
          "name": {{ item.question | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ item.answer | jsonify }}
          }
        }{%- unless forloop.last -%},{%- endunless -%}
        {%- endfor %}
      ]
    }{%- endif %}
  ]
}
</script>
