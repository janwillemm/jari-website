<ul class="tool-card-grid">
  {% for tool in site.data.in-progress-tools %}
    <li>
      <article class="tool-card tool-card--coming" aria-label="{{ tool.name }} — in ontwikkeling">
        <span class="tool-card__media">
          {% include browser-frame.html slug=tool.slug image=tool.image alt=tool.alt variant="embedded" %}
          <span class="tool-card__badge tool-card__badge--coming">In ontwikkeling</span>
        </span>
        <span class="tool-card__body">
          <span class="tool-card__title">{{ tool.name }}</span>
          {% if tool.summary %}
            <span class="tool-card__summary">{{ tool.summary }}</span>
          {% endif %}
        </span>
      </article>
    </li>
  {% endfor %}
</ul>
