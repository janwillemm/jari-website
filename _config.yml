title: Interact GGZ
description: >-
  Innovatiestudio voor de jeugd-ggz. Wij maken de jeugd-GGZ creatiever, innovatiever en meer ervaringsgericht.
tagline: Innovatie en creativiteit in de (jeugd-)ggz
mission: Innovatiestudio voor de jeugd-ggz
url: "https://interactggz.nl"
baseurl: ""
lang: nl
locale: nl_NL

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM

# Tools als collection: elke tool krijgt een eigen detailpagina onder /tools/<slug>/
collections:
  tools:
    output: true
    permalink: /tools/:path/

defaults:
  - scope:
      path: ""
      type: tools
    values:
      layout: tool

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

header_pages:
  - title: Home
    url: /
  - title: Tools
    url: /tools/
  - title: Ontdekker
    url: /ontdekker/
  - title: Samen ontwikkelen
    url: /samen-ontwikkelen/
  - title: Over ons
    url: /over-ons/

contact:
  email: info@interactggz.nl
  tools_email: ggztools@manenschijn.com

# Contactformulieren — POST naar jari-portal API.
contact_form:
  endpoint: "https://portal.interactggz.nl/api/contact"
  development_endpoint: "http://localhost:3100/api/contact"

# Portal — "Probeer" en "Koop" knoppen linken hierheen.
portal:
  url: "https://portal.interactggz.nl"
  development_url: "http://localhost:3100"

# Umami analytics (self-hosted). Leave website_id empty to disable tracking locally.
umami:
  website_id: ""
  script_url: "https://analytics.interactggz.nl/script.js"

authors:
  - name: Jan-Willem Manenschijn
    role: Creatieve techneut
  - name: Rianne Manenschijn
    role: Creatieve orthopedagoog-generalist
