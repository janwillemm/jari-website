  behandelinhoud, pedagogiek, technologie, serious gaming en AI samenkomen.
tagline: Innovatiestudio jeugd-GGZ
mission: >-
  Wij zijn een innovatiestudio voor de jeugd-ggz: een plek waar behandelinhoud,
  pedagogiek, technologie, serious gaming en AI samenkomen om tools te maken die
  behandelaren én kinderen daadwerkelijk gebruiken.
mission_tagline: We maken interactieve interventies!
url: "https://ggztools.nl"
