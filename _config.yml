title: InteractGGZ
description: >-
  InteractGGZ is een innovatiestudio voor de jeugd-ggz. Digitale tools voor
  behandelaars, zoals een EMDR-toolkit, ACT-profiel voor jeugd en een driehoekmodel.
tagline: Innovatie en creativiteit in de (jeugd-)ggz
mission: Innovatiestudio voor de jeugd-ggz
url: "https://interactggz.nl"
baseurl: ""
lang: nl
locale: nl_NL
logo: /assets/images/brand/logo-with-text.png
social:
  name: InteractGGZ
  links:
    - https://creatievemaan.nl/

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM

# Tools als collection: elke tool krijgt een eigen detailpagina onder /tools/<slug>/
collections:
  tools:
    output: true
    permalink: /tools/:path/

defaults:
  - scope:
      path: ""
      type: tools
    values:
      layout: tool
      seo:
        type: SoftwareApplication

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - e2e
  - package.json
  - package-lock.json
  - playwright.config.ts
  - playwright-report
  - test-results
  - scripts

header_pages:
  - title: Home
    url: /
  - title: Tools
    url: /tools/
  - title: Ontdekker
    url: /ontdekker/
  - title: Samen ontwikkelen
    url: /samen-ontwikkelen/
  - title: Over ons
    url: /over-ons/

contact:
  email: info@interactggz.nl
  tools_email: ggztools@manenschijn.com

# Contactformulieren: POST naar jari-portal API.
contact_form:
  endpoint: "https://portal.interactggz.nl/api/contact"
  development_endpoint: "http://localhost:3100/api/contact"

newsletter_form:
  endpoint: "https://portal.interactggz.nl/api/newsletter/subscribe"
  development_endpoint: "http://localhost:3100/api/newsletter/subscribe"

# Portal: "Probeer" en "Koop" knoppen linken hierheen.
portal:
  url: "https://portal.interactggz.nl"
  development_url: "http://localhost:3100"

# Jaarprijs losse tool (incl. btw).
tool_yearly_price: "7.99"

# Umami analytics (self-hosted). Leave website_id empty to disable tracking locally.
umami:
  website_id: "3e23b9ca-fe79-447a-8187-fab3f8689351"
  script_url: "https://analytics.interactggz.nl/script.js"

authors:
  - name: Jan-Willem Manenschijn
    id: jan-willem-manenschijn
    role: Creatieve techneut
    job_title: Serious game designer
    description: >-
      Informatica (TU Delft), serious game designer en CTO. Vertaalt complexe
      vraagstukken naar heldere, werkende tools voor de jeugd-ggz.
  - name: Rianne Manenschijn
    id: rianne-manenschijn
    role: Creatieve orthopedagoog-generalist
    job_title: Orthopedagoog-generalist
    description: >-
      Orthopedagoog-generalist, docent aan de universiteit en redactielid van
      de Pedagoog (NVO).
