title: Interact-GGZ
description: >-
  Wij zijn een innovatiestudio voor de jeugd-ggz. Innovatie en creatieviteit in de jeugd-ggz.
tagline: Innovatie en creatieviteit in de jeugd-ggz.
mission: Wij zijn een innovatiestudio voor de jeugd-ggz
url: "https://interact-ggz.nl"
baseurl: ""
lang: nl
locale: nl_NL

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

header_pages:
  - title: Home
    url: /
  - title: Over ons
    url: /over-ons/
  - title: Aan de slag
    url: /aan-de-slag/
  - title: Prijs
    url: /prijs/
  - title: Visie
    url: /visie/

contact:
  email: info@interact-ggz.nl
  tools_email: ggztools@manenschijn.com

# Formspree — standaard voor contactformulieren op statische Jekyll-sites.
# 1. Maak gratis account op https://formspree.io
# 2. Klik "+ New form" en stel ggztools@manenschijn.com in als ontvanger
# 3. Kopieer het form ID (8 tekens) uit de endpoint-URL
# Zie: https://formspree.io/guides/jekyll/
formspree:
  production_id: ""
  development_id: ""

# Umami analytics (self-hosted). Leave website_id empty to disable tracking locally.
umami:
  website_id: ""
  script_url: "https://analytics.interact-ggz.nl/script.js"

authors:
  - name: Jan-Willem Manenschijn
    role: Creatieve techneut
  - name: Rianne Manenschijn
    role: Creatieve orthopedagoog-generalist

tools:
  - name: Context Driehoek
    status: live
    status_label: Beschikbaar
    summary: Gezins-, kind- en omgevingfactoren in één overzicht voor casusconceptualisatie.
    image: /assets/images/tools/context-driehoek.png
    alt: Screenshot van Context Driehoek
  - name: EMDR — Bilaterale lichtbol
    status: beta
    status_label: In ontwikkeling
    summary: Visuele bilaterale stimulatie om tempo, beeld en duur af te stemmen.
    image: /assets/images/tools/emdr-lichtbol.png
    alt: Screenshot van het EMDR stimulatieveld
