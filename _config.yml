title: Interact-GGZ
description: >-
  Innovatiestudio voor de jeugd-ggz. Wij maken de jeugd-GGZ creatiever, speelser en innovatiever.
tagline: Innovatie en creativiteit in de (jeugd-)ggz
mission: Innovatiestudio voor de jeugd-ggz
url: "https://interact-ggz.nl"
baseurl: ""
lang: nl
locale: nl_NL

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

header_pages:
  - title: Home
    url: /
  - title: Interactieve interventies
    url: /interactieve-interventies/
  - title: Samen ontwikkelen
    url: /samen-ontwikkelen/
  - title: Over ons
    url: /over-ons/

contact:
  email: info@interact-ggz.nl
  tools_email: ggztools@manenschijn.com

# Contactformulieren — POST naar jari-portal API.
contact_form:
  endpoint: "https://portal.interact-ggz.nl/api/contact"
  development_endpoint: "http://localhost:3100/api/contact"

# Umami analytics (self-hosted). Leave website_id empty to disable tracking locally.
umami:
  website_id: ""
  script_url: "https://analytics.interact-ggz.nl/script.js"

authors:
  - name: Jan-Willem Manenschijn
    role: Creatieve techneut
  - name: Rianne Manenschijn
    role: Creatieve orthopedagoog-generalist

tools:
  - name: Context Driehoek
    status: live
    status_label: Beschikbaar
    summary: Gezins-, kind- en omgevingfactoren in één overzicht voor casusconceptualisatie.
    image: /assets/images/tools/context-driehoek.png
    alt: Screenshot van Context Driehoek
  - name: EMDR — Bilaterale lichtbol
    status: beta
    status_label: In ontwikkeling
    summary: Visuele bilaterale stimulatie om tempo, beeld en duur af te stemmen.
    image: /assets/images/tools/emdr-lichtbol.png
    alt: Screenshot van het EMDR stimulatieveld
