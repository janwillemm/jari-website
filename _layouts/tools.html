---
layout: default
---
<article class="page page--tools">
  <header class="page-header">
    <div class="container">
      <h1>{{ page.heading }}</h1>
      {% if page.intro %}
        <p class="page-intro">{{ page.intro }}</p>
      {% endif %}
    </div>
  </header>

  <div class="tools-content">
    {{ content }}
  </div>
</article>
<script src="{{ '/assets/js/tool-card-hover.js' | relative_url }}" defer></script>
{% unless page.no_cta %}
  {% include cta-band-feedback.html %}
{% endunless %}
