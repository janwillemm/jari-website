---
layout: default
---
<article class="page page--tools">
  <header class="page-header">
    <div class="container">
      {% if page.subtitle %}
        <span class="hero__eyebrow">{{ page.subtitle }}</span>
      {% endif %}
      <h1>{{ page.heading }}</h1>
      {% if page.intro %}
        <p class="page-intro">{{ page.intro }}</p>
      {% endif %}
    </div>
  </header>

  <div class="tools-content">
    {{ content }}
  </div>
</article>
{% unless page.no_cta %}
  {% include cta-band-feedback.html %}
{% endunless %}
