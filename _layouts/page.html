---
layout: default
---
<article class="page{% if page.content_measure %} page--measure{% endif %}">
  <header class="page-header">
    <div class="container{% if page.content_measure %} container--measure{% endif %}">
      {% if page.subtitle %}
        <p class="page-eyebrow">{{ page.subtitle }}</p>
      {% endif %}
      <h1>{{ page.heading }}</h1>
      {% if page.intro %}
        <p class="page-intro">{{ page.intro }}</p>
      {% endif %}
    </div>
  </header>
  <div class="page-content container{% if page.content_measure %} container--measure{% endif %}">
    {{ content }}
  </div>
</article>
