---
layout: default
---
<article class="page page--about">
  <header class="page-header">
    <div class="container">
      <h1>{{ page.heading }}</h1>
      {% if page.intro %}
        <p class="page-intro">{{ page.intro }}</p>
      {% endif %}
    </div>
  </header>

  <div class="about-content">
    {{ content }}
  </div>
</article>
{% unless page.no_cta %}
  {% include cta-band.html %}
{% endunless %}
